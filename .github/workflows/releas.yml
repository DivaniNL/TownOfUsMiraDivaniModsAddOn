name: Manual Build and Artifact Export

on:
  workflow_dispatch: # Allows you to manually trigger this build from the GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js v24
      uses: actions/setup-node@v4
      with:
        node-version: '24' # Configures the environment to Node 24

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x' # TownOfUs extensions typically use .NET 6

    - name: Build Mod Project
      run: dotnet build -c Release

    - name: Upload DLL as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DivaniMods-Compiled-DLL
        path: '**/bin/Release/**/*.dll'
        if-no-files-found: error # Fails the workflow early if compilation fails to produce a DLL
