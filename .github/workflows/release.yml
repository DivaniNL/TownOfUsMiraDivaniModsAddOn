name: Build and Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "main"
        type: string

      pr_number:
        description: "PR number to use for release title and description"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-release:
    # Automatically run only when a PR from dev is merged into main.
    # Manual runs are also allowed.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.ref == 'dev'
      )

    runs-on: windows-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || 'main' }}

      # --------------------------------------------------
      # .NET
      # --------------------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      # --------------------------------------------------
      # Read version from DivaniMods.csproj
      # --------------------------------------------------
      - name: Get version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "DivaniMods.csproj"

          $version = $project.Project.PropertyGroup.Version

          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "Could not find <Version> in DivaniMods.csproj"
            exit 1
          }

          Write-Host "Version: $version"

          "version=$version" >> $env:GITHUB_OUTPUT

      # --------------------------------------------------
      # Get PR title + description
      # --------------------------------------------------
      - name: Get PR information
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |

          if ("${{ github.event_name }}" -eq "pull_request") {

            $title = @'
${{ github.event.pull_request.title }}
'@

            $body = @'
${{ github.event.pull_request.body }}
'@

          }
          elseif ("${{ inputs.pr_number }}" -ne "") {

            $pr = gh pr view "${{ inputs.pr_number }}" `
              --repo "${{ github.repository }}" `
              --json title,body |
              ConvertFrom-Json

            $title = $pr.title
            $body = $pr.body

          }
          else {

            $title = "Divani Mods v${{ steps.version.outputs.version }}"
            $body = "Manual release of Divani Mods v${{ steps.version.outputs.version }}."

          }

          "title<<EOF" >> $env:GITHUB_OUTPUT
          $title >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

          "body<<EOF" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      # --------------------------------------------------
      # Restore
      # --------------------------------------------------
      - name: Restore dependencies
        run: dotnet restore DivaniMods.csproj

      # --------------------------------------------------
      # Build DLL
      # --------------------------------------------------
      - name: Build
        run: |
          dotnet build DivaniMods.csproj `
            --configuration Release `
            --no-restore

      # --------------------------------------------------
      # Verify DLL exists
      # --------------------------------------------------
      - name: Verify DLL
        shell: pwsh
        run: |

          $dll = "bin\Release\net6.0\DivaniMods.dll"

          if (!(Test-Path $dll)) {
            Write-Error "DivaniMods.dll was not found!"
            exit 1
          }

          Write-Host "DLL successfully built:"
          Get-Item $dll

      # --------------------------------------------------
      # Create GitHub Release
      # --------------------------------------------------
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |

          $tag = "v${{ steps.version.outputs.version }}"

          $title = @'
${{ steps.pr.outputs.title }}
'@

          $body = @'
${{ steps.pr.outputs.body }}
'@

          gh release create "$tag" `
            "bin\Release\net6.0\DivaniMods.dll" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "$title" `
            --notes "$body"