name: Build and Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "main"
        type: string

      pr_number:
        description: "PR number to use for release title and description"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.ref == 'dev'
      )

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || 'main' }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Get version from csproj
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "DivaniMods.csproj"

          $version = $project.Project.PropertyGroup.Version

          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "Could not find <Version> in DivaniMods.csproj"
            exit 1
          }

          Write-Host "Project version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Get PR information
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          if ($env:EVENT_NAME -eq "pull_request") {
            $title = $env:PR_TITLE
            $body = $env:PR_BODY
          }
          elseif (-not [string]::IsNullOrWhiteSpace($env:PR_NUMBER)) {
            $pr = gh pr view $env:PR_NUMBER `
              --repo $env:REPOSITORY `
              --json title,body |
              ConvertFrom-Json

            $title = $pr.title
            $body = $pr.body
          }
          else {
            $title = "Divani Mods v$($env:VERSION)"
            $body = "Manual release of Divani Mods v$($env:VERSION)."
          }

          $titleDelimiter = "TITLE_$([guid]::NewGuid().ToString())"
          $bodyDelimiter = "BODY_$([guid]::NewGuid().ToString())"

          "title<<$titleDelimiter" >> $env:GITHUB_OUTPUT
          $title >> $env:GITHUB_OUTPUT
          "$titleDelimiter" >> $env:GITHUB_OUTPUT

          "body<<$bodyDelimiter" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          "$bodyDelimiter" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore DivaniMods.csproj

      - name: Build DLL
        run: |
          dotnet build DivaniMods.csproj `
            --configuration Release `
            --no-restore

      - name: Verify DLL
        shell: pwsh
        run: |
          $dll = "bin\Release\net6.0\DivaniMods.dll"

          if (!(Test-Path $dll)) {
            Write-Error "DivaniMods.dll was not found!"
            exit 1
          }

          Write-Host "DLL successfully built:"
          Get-Item $dll

      - name: Create Official Latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TITLE: ${{ steps.pr.outputs.title }}
          RELEASE_BODY: ${{ steps.pr.outputs.body }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          $tag = "v$($env:VERSION)"

          gh release create $tag `
            "bin\Release\net6.0\DivaniMods.dll" `
            --repo $env:REPOSITORY `
            --target $env:SHA `
            --title $env:RELEASE_TITLE `
            --notes $env:RELEASE_BODY `
            --latest